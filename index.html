<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pets Home</title>
<meta name="description" content="Pets Home: إدارة مخزون وإنتاج وأوردرات ومصروفات المزرعة، تعمل على الموبايل بدون إنترنت">
<meta name="theme-color" content="#0A0E0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pets Home">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: phone first — app bar on top, five-slot tab bar at the bottom with a raised "add" button, forms as bottom sheets.
   From 960px wide: a right-hand rail of sections (RTL) and centred dialogs. */
:root{
  /* Near-black palette: true-dark ground, cards a hair lighter, dim borders; mint accent, amber for plates/stock. */
  --bg:#030504; --surface:#0A0E0C; --sunk:#060908; --raise:#111714; --ink:#E3EBE6; --muted:#7E8F85; --line:#18201C;
  --accent:#45A985; --accent-ink:#020A06; --accent-soft:#0F221C; --plate:#D99C3F; --plate-soft:#1F180B;
  --good:#5FBA87; --good-soft:#0C1D14; --warn:#DAA455; --warn-soft:#20180B; --bad:#E57A70; --bad-soft:#26100E;
  --scrim:rgba(0,0,0,.75);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:12px; --tab-h:64px;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--fs, 1.12))}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:.94rem;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n,.kpi b,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:1.45rem;font-weight:700}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{min-height:100vh}
.rail{display:none}
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.appbar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.appbar .ttl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.appbar .farm{font-family:var(--f-display);color:var(--accent);font-size:1.05rem}
.appbar .page{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;flex:none}
main{padding-block:18px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px;min-width:0;max-width:1240px;width:100%;margin-inline:auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76rem;font-weight:500;color:var(--muted);cursor:pointer;padding:6px 2px;min-width:0}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar svg,.rail svg,.sheet-grid svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .add{position:relative}
.tabbar .add i{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow);border:4px solid var(--bg)}
.tabbar .add i svg{width:26px;height:26px;stroke-width:2.4}

@media (min-width:960px){
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:18px;background:var(--surface);border-inline-start:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .appbar,.tabbar{display:none}
  main{padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
}
.monthnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.monthnav b{font-size:1.02rem}
.rail-only{display:none}
/* v4: friendlier home and guidance */
.hello h1{font-size:1.5rem}
.hello .sub{color:var(--muted);font-size:.9rem}
.intro{color:var(--muted);font-size:.9rem;line-height:1.7;margin:0;max-width:65ch}
.bigacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.bigacts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bigact{display:flex;align-items:center;gap:10px;min-height:64px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;text-align:start}
.bigact svg{width:26px;height:26px;flex:none;color:var(--accent);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bigact:first-child{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bigact:first-child svg{color:var(--accent-ink)}
.bigact:active{transform:scale(.98)}
.onboard{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)),var(--accent-soft)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.steps li div{flex:1;display:flex;flex-direction:column;min-width:0}
.steps li small{color:var(--muted);font-size:.8rem}
.steps .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.steps li.done{opacity:.6}
.steps li.done .dot{background:var(--accent);color:var(--accent-ink)}
.steps li.done b{text-decoration:line-through}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.todo li>span{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px}
.todo svg{width:18px;height:18px;flex:none;color:var(--plate);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actions.center{justify-content:center}
.actions .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.att li{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.att .seg button[data-att="out"][aria-pressed="true"]{background:var(--bad-soft);color:var(--bad)}
.att .seg button[data-att="half"][aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.att .seg button[data-att="in"][aria-pressed="true"]{background:var(--good-soft);color:var(--good)}
.fsize{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.perms{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
.perms legend{font-size:.82rem;font-weight:600;color:var(--muted);padding:0 4px}
.help h2{margin-top:6px}
.help ol,.help ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;line-height:1.7}
.toast{display:flex;align-items:center;gap:12px}
.toast-btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;flex:none}
@media (min-width:960px){.rail-only{display:flex;gap:8px;flex-wrap:wrap}}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand .name{font-family:var(--f-display);font-size:1.45rem;color:var(--accent);line-height:1.2}
.brand .sub{color:var(--muted);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav svg{width:18px;height:18px}
.who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:8px;font-size:.88rem}

/* ---------- common ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);font-size:.88rem;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;min-height:46px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:.84rem;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head .hint{color:var(--muted);font-size:.84rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.grid-side{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:18px}
@media (max-width:900px){.grid-side{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi span{color:var(--muted);font-size:.8rem;font-weight:500}
.kpi b{font-size:1.35rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:.76rem}
.kpi.plate{background:var(--plate-soft);border-color:transparent}
.kpi.plate b{color:var(--plate)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero span,.kpi.hero small{color:var(--accent-ink);opacity:.85}
.kpi.bad b{color:var(--bad)}
@media (max-width:400px){.kpi b{font-size:1.12rem}}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:start;font-weight:600;color:var(--muted);font-size:.78rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:end;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
tr.group td{background:var(--sunk);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:.92rem}
.muted{color:var(--muted)} .small{font-size:.82rem} .nowrap{white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Lists become stacked cards on phones: each cell shows its column name. */
@media (max-width:759px){
  .rtable,.rtable tbody,.rtable tfoot{display:block}
  .rtable thead{display:none}
  .rtable tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .rtable tbody tr:last-child{border-bottom:none}
  .rtable td{display:flex;flex-direction:column;gap:1px;padding:0;border:0;text-align:start;min-width:0;white-space:normal}
  .rtable td.n{text-align:start}
  .rtable td[data-label]::before{content:attr(data-label);font-size:.72rem;color:var(--muted);font-weight:500}
  .rtable td.title{grid-column:1/-1;font-size:.98rem;font-weight:600}
  .rtable td.title::before{display:none}
  .rtable td.act{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:6px}
  .rtable td.act::before{display:none}
  .rtable td.span{grid-column:1/-1}
  .rtable td.span::before{display:none}
  .rtable td.blank{display:none}
  .rtable tr.group{background:var(--sunk);border-radius:8px;padding:8px 10px;border:0;margin-top:6px}
  .rtable tr.group td{background:none}
  .rtable tfoot tr{border-top:2px solid var(--line);border-bottom:0}
}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);width:max-content}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.plate{background:var(--plate-soft);color:var(--plate)}
.pills{display:flex;gap:4px;flex-wrap:wrap}

.equation{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:.84rem}
.equation .t{background:var(--sunk);border-radius:6px;padding:3px 8px;white-space:nowrap}
.equation .op{color:var(--muted);font-weight:700}
.equation .res{background:var(--plate-soft);color:var(--plate);font-weight:700;border-radius:6px;padding:3px 8px}
.stack{display:flex;flex-direction:column;gap:14px}
.logline{display:flex;flex-direction:column;gap:4px;min-width:0}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:500;flex:1 1 140px;min-width:0}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted);white-space:nowrap;flex:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],input[type=search],input[type=email],select,textarea{
  border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:11px 13px;width:100%;min-width:0;font-size:max(16px,1rem);min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:64px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
.form .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .f.full{grid-column:1/-1}
.form .f>span{font-size:.82rem;font-weight:600;color:var(--muted)}
.form .f small{color:var(--muted);font-size:.76rem}
.check{display:flex;align-items:center;gap:10px;font-size:.94rem;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) minmax(0,1.1fr) auto;gap:8px;align-items:end;background:var(--sunk);border-radius:10px;padding:10px}
.line label{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);font-weight:600;min-width:0}
.line .tot{font-weight:700;padding:8px 0;text-align:end}
@media (max-width:700px){.line{grid-template-columns:repeat(3,minmax(0,1fr))}.line label:first-child{grid-column:1/-1}.line .tot{grid-column:1/3;text-align:start}}
.stockwarn{grid-column:1/-1;font-size:.78rem;color:var(--bad)}
.stockwarn:empty{display:none}
.err{color:var(--bad);font-size:.88rem;font-weight:600}
.sum-box{display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:.92rem}
.sum-box div{display:flex;justify-content:space-between;gap:10px}
.sum-box .big{font-weight:700;font-size:1.04rem}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem;font-weight:500}
.banner.info{background:var(--accent-soft);color:var(--accent)}

/* ---------- dialogs: bottom sheets on phones ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{position:relative;background:var(--surface);width:100%;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:var(--shadow)}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.modal header::before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:7px;width:40px;height:4px;border-radius:2px;background:var(--line)}
.modal .body{padding:16px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.modal footer{display:flex;gap:8px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .btn{flex:1 1 auto}
@media (min-width:760px){
  .overlay{align-items:flex-start;padding:48px 16px;overflow-y:auto}
  .modal{max-width:580px;border-radius:14px;max-height:none}
  .modal.wide{max-width:900px}
  .modal header::before{display:none}
  .modal header{padding-top:14px}
  .modal footer .btn{flex:0 0 auto}
}
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sheet-grid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--ink);text-align:center}
.sheet-grid button svg{color:var(--accent)}

.toast{position:fixed;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));left:0;right:0;margin-inline:auto;width:max-content;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:min(520px,calc(100% - 32px));text-align:start;line-height:1.5}
@media (min-width:960px){.toast{bottom:24px}}
body:has(.overlay) .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}

.screen{min-height:100vh;display:grid;place-items:center;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.logo{font-family:var(--f-display);font-size:2.1rem;color:var(--accent);line-height:1.1}
.loading{color:var(--muted);text-align:center}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.invoice{display:flex;flex-direction:column;gap:12px}
.inv-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.inv-top .farm{font-family:var(--f-display);font-size:1.4rem;color:var(--accent)}
.changes{font-size:.78rem;color:var(--muted)}
.changes del{color:var(--bad)} .changes ins{color:var(--good);text-decoration:none}
.bar{height:6px;border-radius:3px;background:var(--sunk)} .bar i{display:block;height:6px;border-radius:3px;background:var(--plate)}

@media print{
  body.printing > *:not(#modal-root){display:none!important}
  body.printing .overlay{position:static;background:none;display:block;padding:0}
  body.printing .modal{box-shadow:none;max-height:none;border-radius:0}
  body.printing .modal header,body.printing .modal footer{display:none}
  body.printing .modal .body{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="screen"><div class="loading">جاري فتح Pets Home…</div></div></div>
<div id="modal-root"></div>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    // When a newer version of the app takes over, reload once so it shows right away.
    let hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } hadController = true; });
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
</script>
</body>
</html>
